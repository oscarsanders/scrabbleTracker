# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > select this repository. No secrets or database needed.
#
# Free web services spin down after 15 min idle (cold start ~1 min).
# Games live only in each visitor's browser session: nothing is stored.

services:
  - type: web
    name: scrabble-tracker
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python -m scrabble_tracker
    autoDeploy: true
